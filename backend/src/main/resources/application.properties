# Application details
spring.application.name=backend
server.port=3001

# Hibernate ddl-auto setting
spring.jpa.hibernate.ddl-auto=update

# Strato database
#spring.datasource.url=jdbc:mysql://${DATABASE_SERVER}:${DATABASE_PORT}
#spring.datasource.username=${DATABASE_USERNAME}
#spring.datasource.password=${DATABASE_PASSWORD}
#spring.datasource.driver-class-name=com.mysql.jdbc.Driver

# H2 database configuration
spring.datasource.url=jdbc:h2:file:~/data/data;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect  # Make sure you're using H2Dialect

# H2 Console settings
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# Additional JPA settings
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# Debug mode
debug=true